services:
  mongodb:
    image: mongo:7.0
    container_name: safepulse-mongodb
    restart: unless-stopped
    ports:
      # 외부 침투 방지: 호스트 로컬(127.0.0.1)에서만 접속 허용
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - safepulse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safepulse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENV=${ENV:-production}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/safepulse}
      - DB_NAME=${DB_NAME:-safepulse}
      - JWT_SECRET=${JWT_SECRET:-safepulse_dev_insecure_secret_change_me}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - safepulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: safepulse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safepulse-network

volumes:
  mongo_data:
    driver: local

networks:
  safepulse-network:
    driver: bridge
