<!doctype html>
<html lang="ko" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safety Culture — 마크다운 리더</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#111b2d', 950: '#070c18' }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans KR', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        
        .markdown-body {
            line-height: 1.8;
            color: #cbd5e1;
        }
        .markdown-body h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #334155;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f59e0b;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #1e293b;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2dd4bf;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body p {
            margin-bottom: 1.25rem;
        }
        .markdown-body ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .markdown-body ol {
            list-style-type: decimal;
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .markdown-body li {
            margin-bottom: 0.35rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #f59e0b;
            padding: 0.5rem 1rem;
            margin: 1.25rem 0;
            background: rgba(245, 158, 11, 0.08);
            border-radius: 0 0.5rem 0.5rem 0;
            font-style: italic;
            color: #fde68a;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .markdown-body th {
            background-color: #1e293b;
            color: #38bdf8;
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #334155;
        }
        .markdown-body td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
        }
        .markdown-body tr:hover td {
            background-color: rgba(30, 41, 59, 0.5);
        }
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 0.75rem;
            margin: 1.5rem auto;
            display: block;
            border: 1px solid #334155;
            padding: 0.5rem;
            background: #0f172a;
        }
        .markdown-body a {
            color: #38bdf8;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-md">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <!-- Left: Back Button & Title -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    포털 메인
                </a>
                <div class="truncate">
                    <span id="fileBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">MARKDOWN</span>
                    <h1 id="fileTitle" class="text-sm font-bold text-white truncate inline ml-2">문서 로딩 중...</h1>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="hidden sm:inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 transition">
                    <span>🖨️ 인쇄/PDF</span>
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
        <div id="loading" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 text-sm">마크다운 원문을 불러오는 중입니다...</p>
        </div>

        <div id="errorBox" class="hidden rounded-xl border border-rose-500/30 bg-rose-950/20 p-6 text-center my-10">
            <h2 class="text-lg font-bold text-rose-400 mb-2">파일을 불러올 수 없습니다</h2>
            <p id="errorMsg" class="text-sm text-slate-400 mb-4"></p>
            <a href="index.html" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs hover:bg-slate-700">메인으로 돌아가기</a>
        </div>

        <article id="content" class="markdown-body hidden bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 sm:p-10 shadow-xl"></article>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
        Safety Culture Academic Research Platform &copy; 2026
    </footer>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadMarkdown() {
            const fileName = getQueryParam('file');
            if (!fileName) {
                showError('표시할 파일이 지정되지 않았습니다 (?file=파일명.md).');
                return;
            }

            document.getElementById('fileTitle').textContent = decodeURIComponent(fileName);
            document.title = `${decodeURIComponent(fileName)} — Safety Culture`;

            try {
                const response = await fetch(fileName);
                if (!response.ok) {
                    throw new Error(`파일을 찾을 수 없습니다 (${response.status} ${response.statusText})`);
                }
                const markdownText = await response.text();

                // Configure marked
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });

                const html = marked.parse(markdownText);
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = html;

                document.getElementById('loading').classList.add('hidden');
                contentEl.classList.remove('hidden');

                // Syntax highlight code blocks
                Prism.highlightAll();
            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errorBox = document.getElementById('errorBox');
            errorBox.classList.remove('hidden');
            document.getElementById('errorMsg').textContent = msg;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.textContent = '🌙';
            } else {
                html.classList.add('dark');
                icon.textContent = '☀️';
            }
        }

        window.addEventListener('DOMContentLoaded', loadMarkdown);
    </script>
</body>
</html>
